[tested]
13 = "victim blood of sharp weapons (the game's own)"
123 = "the Electric Rake's sparks: on a Chef Knife (EffectOnWeapon) they show"
181 = "the Freezer Bomb's burst: as EffectOnImpact on a sword, a cold puff at each hit (CZ)"
215 = "while held (condition 30) on a sword: a small trail of snow, good (CZ)"
225 = "while swinging (condition 31) on a sword: a small puff of snow, good (CZ)"
249 = "the Electric Rake's victim sparks: with shock, on a Chef Knife (CZ)"
286 = "dry-ice fog of a level: far too big on a weapon (CZ)"

