[elements.none]
name = "None"
description = "Hits like the weapon whose moves it uses."

[elements.fire]
name = "Fire"
description = "Hit zombies catch fire (like Case West's Tiki Torch)."
child = { cls = "cPropHitZombieInfoItem", keys = { DR2 = "true", PropHitZombieEffect = "0", Support = "true" } }
checked = "Case Zero 2026-10-12: a Bowie Knife set zombies on fire"

[elements.freeze]
name = "Freeze"
description = "Hit zombies freeze solid; a thrown weapon freezes the zombie it sticks in."
child = { cls = "cPropHitZombieInfoItem", keys = { DR2 = "true", PropHitZombieEffect = "1", Support = "true" } }
keys = { Can_Freeze = "true" }
checked = "Case Zero 2026-10-12: a Bowie Knife and a thrown Broadsword froze zombies"

[elements.shock]
name = "Shock"
description = "Hits shock zombies, with chain lightning (like the Electric Rake)."
keys = { Can_Electrocute = "true" }
checked = "Case Zero 2026-10-12: a Chef Knife shocked zombies"

[slots.impact]
name = "On impact"
description = "Where the weapon hits (one burst per hit)."
keys = ["EffectOnImpact#"]          # one per attack: # = 0..attacks-1

[slots.victim]
name = "On the zombie hit"
description = "On the zombie that was hit (blood, sparks)."
keys = ["EffectOnVictim#"]

[slots.held]
name = "While held"
description = "On the weapon all the time it is in Chuck's hands (an aura, a flame)."
condition = 30
checked = "Case Zero 2026-10-12 (Case Zero's own items use conditions up to 29 only)"

[slots.swinging]
name = "While swinging"
description = "On the weapon while it swings (a trail)."
condition = 31
checked = "Case Zero 2026-10-12"
