# Particle effects and weapon elements (phase 13 step 2; dr2kit/catalog/effects.py,
# docs/formats.md §Weapons, docs/modding/20-make-a-weapon.md).
#
# names         every effect of the executable's effect table, in number order (number =
#               position + 1; 0 = none). Case West's 414. Case Zero has the first
#               `cz_shared` of them, then `cz_own` (CZ 371 is roadflare_env_c_1; CW's
#               371 is groundblast_wpn_dbs_1).
#               Made by tools/effect_table.py from each recomp's default_image.bin (check:
#               python tools/effect_table.py <image> --check cz|cw).
# groups        what the effect list shows them under: the first group one of whose words
#               is in the name wins; "category" matches the name's second part (_bld_ ...)
# tested        what was seen in game with a number, by number
# elements      what makes a weapon burn, freeze or shock zombies (measured in game,
#               CZ 2026-10-12): keys set on the weapon, and a child block added to it
# slots         where an effect can go on a weapon, and the keys that put it there

cz_shared = 370
cz_own = ["roadflare_env_c_1"]

