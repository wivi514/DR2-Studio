# Kinds of weapon the weapon wizard offers (phase 13 step 2; dr2kit/catalog/weapons.py,
# docs/modding/20-make-a-weapon.md).
#
# A kind is a game weapon to start from, per game: a new weapon copies its pack (its model
# space, grip nodes, textures' sizes) and its items.txt block, so it swings with its moves
# (AnimBankName + the per-attack keys), holds like it and sounds like it. Measured in game
# (CZ 2026-10-12): borrowed moves work, and the hands go to the item model's own grip
# nodes, so a new shape is laid along the template's (convert/weapon_fit.py).
#
# id        stable name (files, the CLI)
# name      what the wizard shows
# from.cz / from.cw   the game weapon (items.txt block name) in each game; a kind missing
#           in a game isn't offered there
# hands     1 or 2 (what the moves look like), for the list
# note      one line for the wizard

[[kind]]
id = "sword"
name = "Sword (two hands)"
hands = 2
note = "Wide slashes and a jump attack; cuts zombies in half"
from.cz = "Broadsword"
from.cw = "Katana"

