# Game profile: Dead Rising 2: Case West (Xbox 360 XBLA).
# A profile is data, not code: per-game differences go here (CLAUDE.md, Conventions).
# Field reference: docs/dev/code-tour.md, "dr2kit.profiles".

id = "cw"
name = "Dead Rising 2: Case West"
title_id = "58410B00"

recomp_dirs = ["../Dead_Rising_2_Case_West_Xenon_Recomp/assets/game"]
package_globs = ["../Dead_Rising_2_Case_West_Xenon_Recomp/assets/package/58410B00/000D0000/*"]

# The recomp's program, relative to the recomp's folder (the one holding assets/game):
# a release puts it next to assets/, a source build under runtime/. DR2 Studio's Play
# button starts the first one that exists (dr2kit/mods/play.py); `dr2 games set-recomp`
# overrides it.
recomp_executables = ["cw_runtime", "cw_runtime.exe", "CaseWestRecomp-linux-x86_64.AppImage",
                      "runtime/build-release/cw_runtime", "runtime/build/cw_runtime",
                      "runtime/build-release/cw_runtime.exe", "runtime/build/cw_runtime.exe",
                      "runtime/build/Release/cw_runtime.exe"]
# The variable that turns mods off for one run (Play without mods).
no_mods_env = "CW_NO_MODS"
# What a release build sets in its cw_defaults.env (next to the program) for playing.
# Source builds have no such file and start with the renderer OFF (the recomp's default
# for headless test runs: "[vk] renderer OFF (set CW_VKDRAW=1 to enable it)"), so Play
# sets these when the program has no defaults file beside it; your own environment wins.
play_defaults = { CW_VKDRAW = "1" }

# Files the executable checks against a SHA-1 digest: an edited copy crashes the game.
# Read from the XEX's Digest resource (6 entries; tools/xex_digests.py, 2026-10-09,
# docs/formats.md §Digest-checked files). Mods can't touch them.
digest_checked = [
    "data/audio/Safehouse.txt",
    "data/audio/audiomixer.txt",
    "data/audio/curves.txt",
    "data/audio/scenegraph.txt",
    "data/controls/padmap.txt",
    "data/models/zombies/zombie_pdv_variations.txt",
]

# The in-game map's other floors (phase 10): see cz.toml. map_2f fitted to the blueprint
# (its octagon and outer walls), map_b1 to the tunnel pieces of storage_pens_z09.
[[map_floors]]
picture = "map_2f"
x = 168
y = 76
scale = 2.0
when = "above"

[[map_floors]]
picture = "map_b1"
x = 688
y = 509
scale = 1.0
when = "below"

[census]
archive_files = 202   # .big files plus .tex packs and 6 .bcf fonts that are archives
archives = 8017
entries = 172322
models = 1495         # scenes with meshes (dr2 census, phase 3)
skeletons = 144        # scenes with a skeleton and no meshes
model_draws = 10548     # draw calls over all models; every one decodes (dr2 census --models)
sounds = 11735         # .xma entries; every one decodes to its stored length (census --audio)
sfx = 5194             # .sfx sound definitions; all parse
sfx_missing = 1        # .sfx tracks whose recording the shipped data lacks

[variants]
# The game's shape-group table, copied from the executable by
# tools/variant_table.py (docs/formats.md §Variants). Each entry: the mask bit
# and the name patterns (comma list; each is a prefix, '*' ends it). A shape's
# bits are the OR of every entry that matches; '*' only counts when none does.
group_table = "0x829f25d0"
slot_table = "0x82084ae0"
# The game's colour-choice list (zombie_pdv_variations.txt; CW's is empty). The
