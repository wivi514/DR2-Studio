# Game profile: Dead Rising 2: Case West (Xbox 360 XBLA).
# A profile is data, not code: per-game differences go here (CLAUDE.md, Conventions).
# Field reference: docs/dev/code-tour.md, "dr2kit.profiles".

id = "cw"
name = "Dead Rising 2: Case West"
title_id = "58410B00"

recomp_dirs = ["../Dead_Rising_2_Case_West_Xenon_Recomp/assets/game"]
package_globs = ["../Dead_Rising_2_Case_West_Xenon_Recomp/assets/package/58410B00/000D0000/*"]

# Files the executable checks against a SHA-1 digest: an edited copy crashes the game.
# Read from the XEX's Digest resource (6 entries; tools/xex_digests.py, 2026-10-09,
# docs/formats.md §Digest-checked files). Mods can't touch them.
digest_checked = [
    "data/audio/Safehouse.txt",
    "data/audio/audiomixer.txt",
    "data/audio/curves.txt",
    "data/audio/scenegraph.txt",
    "data/controls/padmap.txt",
    "data/models/zombies/zombie_pdv_variations.txt",
]

[census]
archive_files = 202   # .big files plus .tex packs and 6 .bcf fonts that are archives
archives = 8017
entries = 172322
models = 1495         # scenes with meshes (dr2 census, phase 3)
skeletons = 144        # scenes with a skeleton and no meshes
model_draws = 10548     # draw calls over all models; every one decodes (dr2 census --models)
sounds = 11735         # .xma entries; every one decodes to its stored length (census --audio)
sfx = 5194             # .sfx sound definitions; all parse
sfx_missing = 1        # .sfx tracks whose recording the shipped data lacks
