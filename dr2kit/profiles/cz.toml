# Game profile: Dead Rising 2: Case Zero (Xbox 360 XBLA).
# A profile is data, not code: per-game differences go here (CLAUDE.md, Conventions).
# Field reference: docs/dev/code-tour.md, "dr2kit.profiles".

id = "cz"
name = "Dead Rising 2: Case Zero"
title_id = "58410A8D"

# Where to look for the unpacked game, relative to this toolkit's checkout. Each entry is
# a folder that contains `data/`. The first one that exists wins.
recomp_dirs = ["../Dead_Rising_2_Case_Zero_Xenon_Recomp/assets/game"]

# The XBLA package as it sits in a recomp checkout (used by `dr2 games` to point at it).
package_globs = ["../Dead_Rising_2_Case_Zero_Xenon_Recomp/assets/package/58410A8D/000D0000/*"]

# The recomp's program, relative to the recomp's folder (the one holding assets/game):
# a release puts it next to assets/, a source build under runtime/. DR2 Studio's Play
# button starts the first one that exists (dr2kit/mods/play.py); `dr2 games set-recomp`
# overrides it.
recomp_executables = ["cz_runtime", "cz_runtime.exe", "CaseZeroRecomp-linux-x86_64.AppImage",
                      "runtime/build-release/cz_runtime", "runtime/build/cz_runtime",
                      "runtime/build-release/cz_runtime.exe", "runtime/build/cz_runtime.exe",
                      "runtime/build/Release/cz_runtime.exe"]
# The variable that turns mods off for one run (Play without mods).
no_mods_env = "CZ_NO_MODS"
# Case Zero's program needs a scene's node pairs written out (_BONEHIERARCHY_): placing an
# item whose scene lacks them hangs the load for ever (the parent walk sub_827ACAD8 never
# ends; phase 15, 2026-10-12). Every scene of Case Zero has them; scenes brought from
# Case West get them written (dr2kit/convert/crossgame.py fit_scenes).
scene_hierarchy = true
# Byte 9 of every texture header is this game's (CZ 0x23 on all 12,224 textures, CW 0x24 on
# all but 6 of 23,120). Case West's (0x24) brought into Case Zero drew flat white (U1, 2026-10-13); textures copied from the other game get
# this value (dr2kit/convert/crossgame.py fit_scenes).
texture_version = 0x23
# What a release build sets in its cz_defaults.env (next to the program) for playing.
# Source builds have no such file and start with the renderer OFF (the recomp's default
# for headless test runs: "[vk] renderer OFF (set CZ_VKDRAW=1 to enable it)"), so Play
# sets these when the program has no defaults file beside it; your own environment wins.
play_defaults = { CZ_VKDRAW = "1" }

# Files the executable checks against a SHA-1 digest: an edited copy crashes the game
# The XEX's Digest resource has this one entry (tools/xex_digests.py); an edited copy
# crashed the game (checked 2026-10-09, docs/formats.md §Digest-checked files).
# Mods can't touch them.
digest_checked = ["data/audio/Prologue.txt"]

# Files the game reads from data/preload4.big instead of the loose copy (phase 13).
# preload4.big, opened first, holds copies of 86 files (CZ: all byte-identical to their
# twins; CW 59 of 86). Measured (CZ 2026-10-12): the particle effects come from its
# effects.big (data/models/effects.big is never opened), and its boot loader crashes on a
# re-encoded entry (as the CZ recomp found for fecmn.big, its tools/gen_pc_options.py).
# So a mod that changes one of these loose files EVICTS the nested copy instead: its
# index hash is changed, lookups miss, the game reads the loose file (the recomp's
# "part 60" road). Loose vpath -> the entry's name in preload4.big; only measured ones.
# The shader banks (phase 15: shaders brought from the other game) are evicted the same
# way (measured: brought shaders load, 2026-10-12). persistent_filecache.big holds a copy
# of zombiesets.txt that an imported zombie type changes (phase 15 step 4; whether the game
# reads that copy or datafile.big's: test U2), so it is evicted the same way.
preload_evict = { "data/models/effects.big" = "effects.big", "data/models/effects.tex" = "effects.tex", "data/shaders/deadrisingprologue-sd.big" = "deadrisingprologue-sd.big", "data/shaders/deadrisingprologue-vs.big" = "deadrisingprologue-vs.big", "data/shaders/deadrisingprologue-vd.big" = "deadrisingprologue-vd.big", "data/shaders/deadrisingprologue-ps.big" = "deadrisingprologue-ps.big", "data/shaders/deadrisingprologue-pd.big" = "deadrisingprologue-pd.big", "data/shaders/deadrisingprologue-sc.big" = "deadrisingprologue-sc.big", "data/shaders/deadrisingprologue-ss.big" = "deadrisingprologue-ss.big" , "data/datafile/persistent_filecache.big" = "persistent_filecache.big" }



# Armed enemies (phase 15, measured 2026-10-13 in game). The program gives a soldier its gun
# itself (sub_82233EE0): type 24 (mercenary_army) gets MercArmyM16, the other mercenary
# types the item MercAssaultRifle, which Case Zero doesn't ship. Its soldier AI needs a
# mission's single spawn (cMissionSpawnZombie): one spawned by a crowd faulted at once.
# A guard of the other game: an empty slot of these, this behaviour (its moves are in the
# animation graph), its own gun under the weapon name. docs/formats.md §Zombie types.
armed_enemies = { slots = ["mercenary", "mercenary_pheno", "mercenary_tk"], behaviour = "ArmyMerc", weapon = "MercAssaultRifle", gun = "MercArmyM16" }

# The Zombie heap (phase 15, measured 2026-10-13 with gdb, docs/formats.md §Engine memory):
# its size is a constant in the program, the same in both games. A loaded zombie type
# takes its pack unpacked; the loaded types share `shared` bytes more (measured over
# nine Case Zero types). `spare`: what a level leaves free unmodded, at the safehouse
# exit of the street, the title's size. `recomp_growth`: what the recomp adds since
# 2026-10-13 (runtime/cpu/zombie_heap.cpp, CZ_NO_ZOMBIE_HEAP_GROWTH=1 turns it off).
zombie_heap = { size = 30177280, shared = 5480000, recomp_growth = 16777216, spare = { LEVEL_PROLOGUE = 1586656 } }

# The in-game map's other floors (phase 10): picture, where its top-left corner sits on
# the main map picture and its scale, both in the main picture's pixels, and when it
# shows ("above" the map's second-floor height, "below" its basement height, from
# fe_map_points). Measured by fitting each picture to the main map's outlines (the
# layout file's numbers sit under parents we can't resolve): docs/formats.md §Levels.
[[map_floors]]
picture = "map_prologue_2f"
x = 238
y = 584
scale = 1.0
when = "above"

# Measured by `dr2 census` (2026-10-08). Used by tests to notice a different game version.
[census]
archive_files = 197   # .big files plus .tex packs and 9 .bcf fonts that are archives
archives = 7413        # including nested ones (and compressed nested ones)
entries = 124932
models = 1397         # scenes with meshes (dr2 census, phase 3)
skeletons = 113        # scenes with a skeleton and no meshes
model_draws = 6954     # draw calls over all models; every one decodes (dr2 census --models)
sounds = 8916          # .xma entries; every one decodes to its stored length (census --audio)
sfx = 4745             # .sfx sound definitions; all parse
sfx_missing = 22       # .sfx tracks whose recording the shipped data lacks

[variants]
# The game's shape-group table, copied from the executable by
# tools/variant_table.py (docs/formats.md §Variants). Each entry: the mask bit
# and the name patterns (comma list; each is a prefix, '*' ends it). A shape's
# bits are the OR of every entry that matches; '*' only counts when none does.
group_table = "0x829df718"
slot_table = "0x8208a2e0"
# The game's colour-choice list (zombie_pdv_variations.txt; CW's is empty). The
# toolkit finds choices by name (convert/variants.py) and says which the list names.
