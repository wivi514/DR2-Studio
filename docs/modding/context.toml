# "How to mod this": what DR2 Studio shows next to the selected asset, by kind.
# Part of the in-app help (dr2kit/help). Keep each step one short action, naming the
# button. A translation copies this file into docs/modding/<lang>/ and translates the
# text (keep the keys and the guide file names). A step can link a help section:
# [how](07-blender-setup.md#seeing-the-model-clearly-textures-and-bones) opens it.

[texture]
title = "Change this texture"
steps = [
  "Open or create a mod (bottom bar).",
  "Click Edit in image editor…: the picture opens in your editor; every time you save it, Studio puts it in your mod and shows it.",
  "Or drop a PNG of the same size onto this window (or use Replace with PNG…).",
  "Click Play to see it in game.",
]
guide = "05-first-mod-texture.md"

[model]
title = "Change this model"
steps = [
  "Open or create a mod (bottom bar).",
  "Shape: click Open in Blender, edit, then in Blender's DR2 tab Check rig and Export to mod. In Blender: Z → Material Preview shows the textures; Viewport Overlays → untick Bones hides the skeleton ([how](07-blender-setup.md#seeing-the-model-clearly-textures-and-bones)).",
  "Textures: Export .glb… to Substance Painter (or any texturing program), export PNGs, then Import textures… (or drop the folder here).",
  "A zombie? The Variants panel (right of the 3D view) picks its head, shirt, colours… Export .glb… gives that look; Export all… and Open in Blender give every part, sorted ([how](17-variants.md)).",
  "A weapon? New weapon… (bottom bar) makes one of your own like it: your model, damage, fire / ice / shock, effects, its icon and a combo card, and shows Chuck holding it in 3D ([how](20-make-a-weapon.md)). `dr2 hold <item> --png` shows Chuck holding a game item. Effects… recolours the game's particle effects or makes your own ([how](21-effects.md)).",
  "Click Play to see it in game. Limits: Help → Limits.",
]
guide = "14-texturing-tools.md"

[skeleton]
title = "Use this skeleton"
steps = [
  "Skeletons can't be replaced, but new meshes can be rigged to them.",
  "Click Export .glb… (or Open in Blender) to get the armature for your own model.",
]
guide = "09-new-model.md"

[audio]
title = "Replace this sound"
steps = [
  "Click Play (in the middle) to hear it.",
  "Open or create a mod (bottom bar).",
  "Drop a WAV, OGG, FLAC or MP3 onto this window (or use Replace with audio…). It is fitted to the sound's length.",
  "Click Play in the toolbar to hear it in game (recomps only).",
]
guide = "10-audio.md"

[sfx]
title = "A sound effect definition"
steps = [
  "The Related list shows the recordings it plays; double-click one to listen.",
  "To change the sound, replace those recordings.",
]
guide = "10-audio.md"

[strings]
title = "Change in-game text"
steps = [
  "Open or create a mod (bottom bar).",
  "Type in the filter box to find the text, double-click it, type the new one, press Enter.",
  "Strings that use colours or button icons must start with @. Keep %s and %d.",
  "Click Play to read it in game.",
]
guide = "11-text.md"

[text]
title = "Edit this text file"
steps = [
  "Open or create a mod (bottom bar).",
  "Edit the text in the middle and click Save to mod. Changes shows what you changed.",
  "Click Play to try it in game.",
]
guide = "11-text.md"

[anim]
title = "An animation"
steps = [
  "It plays here: on Chuck when it is made for the player's rig, as blue lines on its own rig otherwise (zombies, cutscene props). Pause and the slider stop on any frame; In place keeps the body where it stands.",
  "Export .glb… or Open in Blender: the move as a Blender Action (Space plays it).",
  "A weapon's moves are in data/streamedassets.big/anm_<its AnimBankName>.big; New weapon… shows Chuck swinging yours ([how](20-make-a-weapon.md)).",
  "Animations can't be replaced yet.",
]
guide = "03-browsing.md"

[video]
title = "A Case West movie"
steps = [
  "Play it here, or Export MP4… to keep a copy.",
  "Movies can't be replaced yet (that needs Bink's own encoder).",
]
guide = "04-extracting.md"

[archive]
title = "An archive"
steps = [
  "An archive holds other assets: open it in the tree on the left and pick one.",
]
guide = "03-browsing.md"
