[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dr2kit"
version = "0.1.0.dev0"
description = "Modding toolkit for Dead Rising 2: Case Zero and Case West (Xbox 360)"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "wivi514" }]
dependencies = ["platformdirs>=3"]

[project.optional-dependencies]
# numpy speeds up texture work (untiling, DXT) ~50x; everything also runs without it.
fast = ["numpy"]
dev = ["pytest>=7"]
# Sounds (phase 5): PyAV bundles ffmpeg's XMA decoder (BSD + LGPL ffmpeg; THIRD_PARTY.md).
audio = ["av>=12", "numpy"]
# DR2 Studio, the GUI (LGPL PySide6; see THIRD_PARTY.md). PyAV so it can play sounds.
studio = ["PySide6>=6.5", "numpy", "av>=12"]

[project.scripts]
dr2 = "dr2kit.cli.main:main"

[tool.setuptools.packages.find]
include = ["dr2kit*"]

[tool.setuptools.package-data]
"dr2kit.profiles" = ["*.toml"]
"dr2kit.index" = ["*.sql"]
"dr2kit.catalog" = ["*.toml"]
# DR2 Studio's 3D view page and the three.js files it loads (MIT, vendored unmodified).
"dr2kit.studio" = ["icon/*.svg", "web/*.html", "web/*.js", "web/vendor/three/LICENSE", "web/vendor/three/**/*.js"]
# Prebuilt native LZX decoders, when a release build drops them in (see docs/dev/setup.md).
"dr2kit.container.lzx" = ["_native/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gamedata: needs a real game install (skipped, with the reason, when absent)",
    "slow: takes more than a few seconds",
]
